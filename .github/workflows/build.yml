name: RT-ACRH17 Firmware Matrix
run-name: RT-ACRH17 matrix build · ${{ github.ref_name }} · run ${{ github.run_id }}
on:
  workflow_dispatch:
  push:
    # The matrix checks out all four fixed variant refs below.  Listening on
    # the default branch only prevents a batch branch sync from spawning and
    # cancelling three redundant matrix runs; other branches remain
    # available through workflow_dispatch.
    branches: ['codex/openwrt-24.10']
    paths-ignore: ['**/*.md']
permissions:
  contents: read
concurrency:
  # One matrix run owns all four variants. A newer push replaces an older
  # matrix run instead of leaving one build per branch consuming a runner.
  group: acrh17-matrix-${{ github.repository }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: openwrt-campus
            ref: codex/openwrt-24.10
            label: OpenWrt 24.10 Campus · mwan3
          - id: immortalwrt-campus
            ref: codex/immortalwrt-24.10
            label: ImmortalWrt 24.10 Campus · mwan3
          - id: openwrt-singlewan
            ref: codex/openwrt-24.10-singlewan
            label: OpenWrt 24.10 Single WAN
          - id: immortalwrt-singlewan
            ref: codex/immortalwrt-24.10-singlewan
            label: ImmortalWrt 24.10 Single WAN
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CCACHE_MAXSIZE: 2G
      VARIANT_ID: ${{ matrix.id }}
      VARIANT_REF: ${{ matrix.ref }}
      VARIANT_LABEL: ${{ matrix.label }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout project variant
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
          path: project

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl time lua5.1
          mkdir -p project/logs project/artifacts

      - name: Validate project scripts
        working-directory: project
        run: |
          sh -n scripts/prepare.sh
          sh -n files/etc/uci-defaults/90-acrh17
          sh -n files/usr/libexec/acrh17-usbwan-redial
          sh -n files/usr/libexec/acrh17-usb-net-status
          sh -n package/ruijie-auth/files/usr/libexec/ruijie-auth
          sh -n package/ruijie-auth/files/etc/init.d/ruijie-auth
          find package -name '*.lua' -exec luac -p {} \;
          python3 -m unittest discover -s tests -v

      - name: Checkout pinned OpenWrt and feeds
        working-directory: project
        run: |
          set -o pipefail
          source sources.env
          git -c init.defaultBranch=main init openwrt
          git -C openwrt remote add origin "$OPENWRT_REPOSITORY"
          git -C openwrt fetch --depth=1 origin "$OPENWRT_COMMIT"
          git -C openwrt checkout --detach FETCH_HEAD
          cd openwrt
          cat > feeds.conf <<FEEDS
          src-git packages $PACKAGES_REPOSITORY^$PACKAGES_COMMIT
          src-git luci $LUCI_REPOSITORY^$LUCI_COMMIT
          src-git routing $ROUTING_REPOSITORY^$ROUTING_COMMIT
          FEEDS
          ./scripts/feeds update -a 2>&1 | tee ../logs/feeds-update.log
          # This optional LuCI app currently depends on
          # rpcd-mod-rad3-enc, absent from the pinned packages feed.  Remove
          # its feed source before install so feeds itself stays warning-free;
          # the app is not part of any requested firmware profile.
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          radicale = Path('feeds/luci/applications/luci-app-radicale3')
          if radicale.is_symlink():
              radicale.unlink()
          elif radicale.is_dir():
              shutil.rmtree(radicale)
          PY
          # Feed metadata contains optional packages from the pinned
          # distributions whose dependencies are intentionally not shipped
          # in this minimal profile.  Keep the complete output in the log,
          # but do not turn upstream metadata notices into Actions warnings.
          # A non-zero feeds exit status still fails immediately; selected
          # package consistency is checked by make defconfig below.
          set +e
          ./scripts/feeds install -a > ../logs/feeds-install.log 2>&1
          feed_status=$?
          set -e
          if [ "$feed_status" -ne 0 ]; then
            cat ../logs/feeds-install.log
            exit "$feed_status"
          fi
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('../logs/feeds-install.log').read_text(errors='replace').splitlines()
          warnings = [line for line in lines if line.startswith('WARNING:')]
          if warnings:
              Path('../logs/feeds-warnings.log').write_text('\n'.join(warnings) + '\n')
              print(f'Feed metadata notices saved to ../logs/feeds-warnings.log ({len(warnings)} lines)')
          print('\n'.join(line for line in lines if not line.startswith('WARNING:')))
          PY
          ../scripts/prepare.sh 2>&1 | tee ../logs/prepare.log
          cp ../configs/acrh17.config .config
          make defconfig 2>&1 | tee ../logs/defconfig.log
          python3 ../scripts/verify-config.py ../configs/acrh17.config .config 2>&1 | tee ../logs/verify-config.log
          cp .config ../artifacts/build.config
          ./scripts/diffconfig.sh > ../artifacts/diffconfig
          cp ../sources.env ../artifacts/
          git rev-parse HEAD > ../artifacts/openwrt-commit.txt
          git -C .. rev-parse HEAD > ../artifacts/project-commit.txt

      - uses: actions/cache@v6
        with:
          path: project/openwrt/dl
          key: dl-${{ runner.os }}-${{ matrix.id }}-${{ hashFiles('project/sources.env') }}
          restore-keys: |
            dl-${{ runner.os }}-${{ matrix.id }}-

      - uses: actions/cache@v6
        with:
          path: project/openwrt/.ccache
          key: cc-${{ runner.os }}-${{ matrix.id }}-${{ hashFiles('project/sources.env', 'project/configs/acrh17.config') }}
          restore-keys: |
            cc-${{ runner.os }}-${{ matrix.id }}-

      - name: Download sources
        working-directory: project/openwrt
        run: |
          set -o pipefail
          make download -j8 2>&1 | tee ../logs/download.log

      - name: Compile firmware
        working-directory: project/openwrt
        run: |
          set -o pipefail
          set +e
          make -j"$(nproc)" V=s 2>&1 | tee ../logs/build.log
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            make -j1 V=s 2>&1 | tee ../logs/build-serial.log
          fi

      - name: Verify firmware and core packages
        working-directory: project
        run: |
          python3 scripts/verify-artifacts.py openwrt/bin/targets/ipq40xx/generic
          cp -R openwrt/bin/targets/ipq40xx/generic/. artifacts/
          mkdir -p fast-base
          cp openwrt/bin/targets/ipq40xx/generic/*imagebuilder*.tar.zst fast-base/
          python3 scripts/fast-base.py stamp fast-base

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: RT-ACRH17-${{ matrix.id }}-${{ github.run_id }}
          path: |
            project/artifacts/
            !project/artifacts/*imagebuilder*.tar.zst
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v7
        with:
          name: fast-base-${{ matrix.id }}-${{ github.run_id }}
          path: project/fast-base/
          retention-days: 30

      - name: Upload full logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ matrix.id }}-${{ github.run_id }}
          path: project/logs/
          if-no-files-found: warn
          retention-days: 30

  release:
    name: Publish .bin firmware release
    needs: build
    if: needs.build.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Download matrix firmware artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: RT-ACRH17-*-${{ github.run_id }}
          path: release-input
          merge-multiple: false

      - name: Publish sysupgrade binaries
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          shopt -s nullglob
          for artifact in release-input/RT-ACRH17-*; do
            [ -d "$artifact" ] || continue
            variant=${artifact##*/RT-ACRH17-}
            run_id_suffix="-${GITHUB_RUN_ID}"
            variant="${variant%"$run_id_suffix"}"
            for image in "$artifact"/*.bin; do
              [ -f "$image" ] || continue
              cp "$image" "release-assets/${variant}-$(basename "$image")"
            done
          done
          mapfile -d '' assets < <(find release-assets -type f -name '*.bin' -print0 | sort -z)
          [ "${#assets[@]}" -eq 4 ] || {
            printf 'Expected four sysupgrade .bin files, found %s\n' "${#assets[@]}" >&2
            find release-input -maxdepth 3 -type f -print >&2
            exit 1
          }
          tag="build-${GITHUB_RUN_ID}"
          title="RT-ACRH17 firmware build ${GITHUB_RUN_ID}"
          cat > release-notes.md <<EOF
          Automated OpenWrt 24.10 / ImmortalWrt 24.10 RT-ACRH17 matrix build.

          Only sysupgrade .bin images are attached; use the matching initramfs artifact for first RAM-boot testing when supported by the installed OpBoot version. No ART, EEPROM, Factory, calibration, or bootloader data is included or modified.
          EOF
          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --notes-file release-notes.md
