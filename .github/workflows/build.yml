name: Build RT-ACRH17 OpenWrt
on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
concurrency:
  group: acrh17-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl time lua5.1
          mkdir -p logs artifacts
      - name: Validate project scripts
        run: |
          sh -n scripts/prepare.sh
          sh -n files/etc/uci-defaults/90-acrh17
          sh -n files/usr/libexec/acrh17-usbwan-redial
          sh -n files/usr/libexec/acrh17-usb-net-status
          sh -n package/ruijie-auth/files/usr/libexec/ruijie-auth
          sh -n package/ruijie-auth/files/etc/init.d/ruijie-auth
          find package -name '*.lua' -exec luac -p {} \;
          python3 -m unittest discover -s tests -v
      - name: Checkout pinned OpenWrt and feeds
        run: |
          source sources.env
          git init openwrt
          git -C openwrt remote add origin "$OPENWRT_REPOSITORY"
          git -C openwrt fetch --depth=1 origin "$OPENWRT_COMMIT"
          git -C openwrt checkout --detach FETCH_HEAD
          cd openwrt
          cat > feeds.conf <<FEEDS
          src-git packages https://github.com/openwrt/packages.git^$PACKAGES_COMMIT
          src-git luci https://github.com/openwrt/luci.git^$LUCI_COMMIT
          src-git routing https://github.com/openwrt/routing.git^$ROUTING_COMMIT
          FEEDS
          ./scripts/feeds update -a 2>&1 | tee ../logs/feeds-update.log
          ./scripts/feeds install -a 2>&1 | tee ../logs/feeds-install.log
          ../scripts/prepare.sh 2>&1 | tee ../logs/prepare.log
          cp ../configs/acrh17.config .config
          make defconfig 2>&1 | tee ../logs/defconfig.log
          python3 ../scripts/verify-config.py ../configs/acrh17.config .config
          cp .config ../artifacts/build.config
          ./scripts/diffconfig.sh > ../artifacts/diffconfig
          cp ../sources.env ../artifacts/
          git rev-parse HEAD > ../artifacts/openwrt-commit.txt
          git -C .. rev-parse HEAD > ../artifacts/project-commit.txt
      - name: Download sources
        working-directory: openwrt
        run: |
          make download -j8 2>&1 | tee ../logs/download.log
      - name: Compile firmware
        working-directory: openwrt
        run: |
          set +e
          make -j"$(nproc)" V=s 2>&1 | tee ../logs/build.log
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            make -j1 V=s 2>&1 | tee ../logs/build-serial.log
          fi
      - name: Verify firmware and core packages
        run: |
          python3 scripts/verify-artifacts.py openwrt/bin/targets/ipq40xx/generic
          cp -R openwrt/bin/targets/ipq40xx/generic/. artifacts/
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: RT-ACRH17-OpenWrt-24.10-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Upload full logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: logs/
          if-no-files-found: warn
          retention-days: 30
