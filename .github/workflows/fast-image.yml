name: Fast RT-ACRH17 image
on:
  workflow_dispatch:
    inputs:
      base_run:
        description: Successful full build run ID from this branch
        required: true
        type: string
      variant:
        description: Matrix variant to rebuild with ImageBuilder
        required: true
        type: choice
        default: openwrt-campus
        options:
          - openwrt-campus
          - immortalwrt-campus
          - openwrt-singlewan
          - immortalwrt-singlewan
permissions:
  actions: read
  contents: read
concurrency:
  group: acrh17-fast-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_RUN: ${{ inputs.base_run }}
      VARIANT: ${{ inputs.variant }}
      VARIANT_REF: ${{ fromJSON('{"openwrt-campus":"codex/openwrt-24.10","immortalwrt-campus":"codex/immortalwrt-24.10","openwrt-singlewan":"codex/openwrt-24.10-singlewan","immortalwrt-singlewan":"codex/immortalwrt-24.10-singlewan"}')[inputs.variant] }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.VARIANT_REF }}
      - name: Validate and download matching baseline
        run: |
          [[ "$BASE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BASE_RUN" > run.json
          python3 - <<'PY'
          import json, os
          r = json.load(open('run.json'))
          assert r['conclusion'] == 'success', 'Baseline must be successful'
          assert r['path'] == '.github/workflows/build.yml', 'Choose a full matrix build'
          PY
          gh run download "$BASE_RUN" --repo "$GITHUB_REPOSITORY" --name "fast-base-${VARIANT}-${BASE_RUN}" --dir baseline
          python3 scripts/fast-base.py check baseline
      - name: Install tools and validate overlays
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev zlib1g-dev libssl-dev python3 unzip zstd lua5.1
          python3 scripts/validate-project.py
      - name: Build sysupgrade image
        run: |
          set -o pipefail
          mkdir -p imagebuilder overlay artifacts
          tar --zstd -xf baseline/*imagebuilder*.tar.zst --strip-components=1 -C imagebuilder
          cp -a files/. overlay/
          # The overlay keeps the mode it was copied with, so every script has
          # to be executable here regardless of what git recorded.
          chmod 755 overlay/usr/libexec/*
          packages=$(python3 - <<'PY'
          from pathlib import Path
          print(' '.join(x.removeprefix('CONFIG_PACKAGE_').removesuffix('=y') for x in Path('configs/acrh17.config').read_text().splitlines() if x.startswith('CONFIG_PACKAGE_') and x.endswith('=y') and '_INCLUDE_' not in x))
          PY
          )
          # uuplugin 的二进制在完整构建时从上游下载，ImageBuilder 的包索引里没有
          # 它。基线产物带了编好的 ipk，这里换成文件路径安装；基线里没有就别
          # 浪费时间打包——装不进去的插件会让 verify-artifacts.py 拒绝镜像。
          case " $packages " in
            *" uuplugin "*)
              # make -C imagebuilder 会切目录，ipk 必须给绝对路径。
              ipk=$(ls "$PWD"/baseline/packages/uuplugin_*.ipk 2>/dev/null | head -1)
              [ -n "$ipk" ] || { echo '基线产物里缺 uuplugin.ipk，请重跑一次完整构建' >&2; exit 1; }
              packages=${packages/uuplugin/$ipk}
              ;;
          esac
          make -C imagebuilder image PROFILE=asus_rt-ac42u PACKAGES="$packages" FILES="$PWD/overlay" 2>&1 | tee fast-build.log
          python3 scripts/verify-artifacts.py imagebuilder/bin/targets/ipq40xx/generic --sysupgrade-only
          cp -a imagebuilder/bin/targets/ipq40xx/generic/. artifacts/
          cp baseline/project-commit.txt artifacts/base-commit.txt
          git rev-parse HEAD > artifacts/project-commit.txt
      - uses: actions/upload-artifact@v7
        with:
          name: fast-firmware-${{ github.sha }}
          path: artifacts/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fast-logs-${{ github.sha }}
          path: fast-build.log
