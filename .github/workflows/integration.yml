name: Test UA3F dual WAN routing
on:
  workflow_dispatch:
  push:
    branches: ['codex/audit-20260912']
  workflow_call:
permissions:
  contents: read
jobs:
  routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Install isolated network test tools
        run: sudo apt-get update && sudo apt-get install -y nftables iptables iproute2 curl
      - name: Validate project
        run: |
          sudo apt-get install -y lua5.1
          python3 scripts/validate-project.py
      - name: Build pinned UA3F for the Linux test host
        shell: bash
        run: |
          source sources.env
          git clone https://github.com/SunBK201/UA3F.git /tmp/ua3f-integration
          git -C /tmp/ua3f-integration checkout --detach "$UA3F_COMMIT"
          python3 scripts/patch-ua3f-mwan3.py /tmp/ua3f-integration
          cp tests/ua3f-mwan3_test.go /tmp/ua3f-integration/internal/server/nfqueue/mwan3_test.go
          cd /tmp/ua3f-integration
          GOTOOLCHAIN=local CGO_ENABLED=0 go test ./internal/server/nfqueue
          GOTOOLCHAIN=local CGO_ENABLED=0 go build -o /tmp/ua3f-test .
      - name: Test transparent rewrite on both simulated WANs
        run: sudo bash tests/routing-netns.sh /tmp/ua3f-test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: routing-test-logs
          path: /tmp/acrh17-routing-logs/
